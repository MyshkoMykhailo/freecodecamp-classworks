<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Business Card</title>
    <link rel="stylesheet" href="./css/basic-visit-card.css" />
  </head>

  <body>
    <div class="business-card">
      <img
        class="profile-image"
        src="https://cdn.freecodecamp.org/curriculum/labs/flower.jpg"
        alt="profile image"
      />
      <p class="full-name">Your Name</p>
      <p class="designation">Software Developer</p>
      <p class="company">Company Name</p>
      <hr />
      <p>E-mail: your-email@example.com</p>
      <p>Phone: (123) 456-7890</p>
      <a href="https://github.com/MyshkoMykhailo" class="portfolio-link"
        >Portfolio</a
      >
      <hr />
      <div class="social-media">
        <h2>Connect with me</h2>
        <a href="https://x.com/">Twitter</a>
        <a href="https://www.linkedin.com/">LinkedIn</a>
        <a href="https://github.com/MyshkoMykhailo">GitHub</a>
      </div>
    </div>
  </body>
</html>
